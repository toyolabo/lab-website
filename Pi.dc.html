<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main style="padding-bottom:90px">

  <!-- 題と一言（ニュース・メンバー・論文・アクセスと同じ書き方。#108）。写真は右に置き、題の位置をほかのページとそろえる -->
  <div style="max-width:1180px;margin:0 auto;padding:64px 28px 0">
    <div style="display:flex;gap:28px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:0 0 34px">
      <div style="flex:1;min-width:260px">
        <h1 style="font-family:'Noto Sans JP',sans-serif;font-weight:700;letter-spacing:.02em;font-size:32px;line-height:1.4;color:var(--ink);margin:0 0 12px">{{ heading }}</h1>
        <p style="font-size:16px;font-weight:700;line-height:1.8;color:var(--text);margin:0">{{ catch }}</p>
      </div>
      <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ true }}">
        <img src="{{ photo }}" alt="{{ heading }}" style="width:150px;height:150px;border-radius:14px;object-fit:cover;flex:none;border:1px solid var(--line)">
      </sc-if>
    </div>
    <!-- 文章も枠いっぱい（幅 1180px・左右の余白 28px の内側）にする。ほかのページと同じ（#110） -->
    <div>
      <article style="font-size:16px;line-height:2.05;color:var(--text)">
        <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="3">
          <div style="margin:0 0 20px">
            <sc-if value="{{ b.isH2 }}" hint-placeholder-val="{{ false }}">
              <h2 style="font-family:'Noto Sans JP',sans-serif;font-weight:700;letter-spacing:.02em;font-size:24px;color:var(--ink);margin:38px 0 4px;padding-bottom:10px;border-bottom:2px solid var(--soft);line-height:1.5">{{ b.text }}</h2>
            </sc-if>
            <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}">
              <h3 style="font-family:'Noto Sans JP',sans-serif;font-weight:700;letter-spacing:.02em;font-size:20px;color:var(--accent);margin:26px 0 2px;line-height:1.55">{{ b.text }}</h3>
            </sc-if>
            <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ true }}">
              <p style="margin:0"><sc-for list="{{ b.segments }}" as="s" hint-placeholder-count="1"><sc-if value="{{ s.isText }}" hint-placeholder-val="{{ true }}"><span>{{ s.text }}</span></sc-if><sc-if value="{{ s.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ s.href }}" target="{{ s.target }}" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px">{{ s.text }}</a></sc-if></sc-for></p>
            </sc-if>
            <sc-if value="{{ b.isList }}" hint-placeholder-val="{{ false }}">
              <ul style="margin:4px 0 0;padding-left:22px;font-size:16px;line-height:1.9">
                <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3">
                  <li style="margin:0 0 6px"><sc-for list="{{ it.segments }}" as="s" hint-placeholder-count="1"><sc-if value="{{ s.isText }}" hint-placeholder-val="{{ true }}"><span>{{ s.text }}</span></sc-if><sc-if value="{{ s.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ s.href }}" target="{{ s.target }}" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px">{{ s.text }}</a></sc-if></sc-for></li>
                </sc-for>
              </ul>
            </sc-if>
            <sc-if value="{{ b.isImage }}" hint-placeholder-val="{{ false }}">
              <figure style="margin:6px auto;width:{{ b.figW }};max-width:100%"><img src="{{ b.src }}" alt="{{ b.caption }}" style="width:100%;border-radius:12px;border:1px solid var(--line);display:block"><sc-if value="{{ b.hasCaption }}" hint-placeholder-val="{{ false }}"><figcaption style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7;text-align:{{ b.capAlign }}">{{ b.caption }}</figcaption></sc-if></figure>
            </sc-if>
            <sc-if value="{{ b.isVideo }}" hint-placeholder-val="{{ false }}">
              <a href="{{ b.url }}" target="_blank" rel="noopener" style="display:block;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);text-decoration:none;margin:6px 0">
                <img src="{{ b.thumb }}" alt="{{ b.caption }}" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover">
                <span style="position:absolute;inset:0;display:grid;place-items:center"><span style="width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.62);display:grid;place-items:center;color:#fff;font-size:22px;padding-left:5px">▶</span></span>
              </a>
            </sc-if>
            <sc-if value="{{ b.isLinkCard }}" hint-placeholder-val="{{ false }}">
              <a href="{{ b.href }}" target="{{ b.target }}" rel="noopener" class="site-resource"><span style="flex:1;min-width:0"><span class="site-resource-title">{{ b.label }}</span><span class="site-resource-url">{{ b.url }}</span></span><span style="flex:none;color:var(--accent)">↗</span></a>
            </sc-if>
            <sc-if value="{{ b.isHtml }}" hint-placeholder-val="{{ false }}">{{ b.el }}</sc-if>
          </div>
        </sc-for>
      </article>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;db&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;lang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onGoHome&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  // =========================================================
  // 研究室主宰（教授の詳細プロフィール）ページ。
  // 本文は content/pi/pi.md（英語版 pi.en.md）。書式は他ページと同じブロック書式。
  // 見出しは「## 」が大見出し、「### 」が小見出しになります。
  // リンク先を「#/publications」のように書くとサイト内ページへ同じタブで移動します。
  // =========================================================
  state = { rich:null };
  componentDidMount(){
    import(new URL('./blocks.js', location.href).href)
      .then(m=>this.setState({rich:m}))
      .catch(e=>console.error('blocks.js 読み込み失敗:', e));
  }
  // サイト内リンク（#/…）は現在の言語を引き継ぎ、同じタブで開く
  linkTarget(href){
    const lang=this.props.lang==='en'?'en':'ja';
    if(/^#\//.test(href||'')) return { href:'#'+(lang==='en'?'/en':'')+href.slice(1), target:'_self' };
    return { href, target:'_blank' };
  }
  segs(list){ return (list||[]).map(s=>s.isLink ? { ...s, ...this.linkTarget(s.href) } : s); }
  toBlocks(body){
    const rich=this.state.rich;
    if(!rich) return (body||[]).filter(p=>typeof p==='string').map(p=>({isP:true,segments:[{isText:true,text:p}]}));
    return rich.normalizeBlocks(body).map(b=>{
      if(b.isHeading) return { ...b, isH2:!b.isSub, isH3:!!b.isSub };
      if(b.isP) return { ...b, segments:this.segs(b.segments) };
      if(b.isList) return { ...b, items:(b.items||[]).map(it=>({ segments:this.segs(it.segments) })) };
      if(b.isLinkCard) return { ...b, ...this.linkTarget(b.url) };
      if(b.isHtml) return { ...b, el:React.createElement('div',{dangerouslySetInnerHTML:{__html:b.html}}) };
      return b;
    });
  }
  renderVals(){
    const lang=this.props.lang==='en'?'en':'ja';
    const L={
      ja:{ home:'ホーム', pi:'研究室主宰' },
      en:{ home:'Home', pi:'Principal Investigator' },
    }[lang];
    const p=(this.props.db||{}).pi||{};
    const photo=p.heroImage||'';
    return {
      goHome:this.props.onGoHome||(()=>{}), L,
      heading:p.heading||L.pi, catch:p.catch||'',
      photo, hasPhoto:!!photo,
      blocks:this.toBlocks(p.body||[]),
    };
  }
}
</script>
</body>
</html>
